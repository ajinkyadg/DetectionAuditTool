[project]
name = "detection-audit-tool"
version = "0.1.0"
description = "Detection rule catalogue, attack-to-detection simulator, and SIEM log validation/audit tool"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
dat = "detection_audit_tool.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["detection_audit_tool"]
