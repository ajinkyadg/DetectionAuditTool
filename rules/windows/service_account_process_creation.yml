id: WIN-1008
title: Interactive Shell Spawned Under a Service Account
description: >
  Detects process creation (EventID 4688) where a command interpreter runs
  under an account whose name marks it as a service account. Service accounts
  run services; they do not open shells. A cmd.exe or powershell.exe parented
  under one is a strong indicator that harvested service-account credentials
  are being used for hands-on-keyboard activity.
level: high
mitre_attack:
  - T1059.003
  - T1078.003
logsource:
  product: windows
  service: security
event_ids:
  - "4688"
detection_type: selection
selection:
  EventID: 4688
  NewProcessName|endswith:
    - "cmd.exe"
    - "powershell.exe"
    - "pwsh.exe"
  SubjectUserName|startswith:
    - "svc"
    - "sql"
    - "backup"
required_fields:
  - NewProcessName
  - ParentProcessName
  - SubjectUserName
  - CommandLine
false_positives:
  - Scheduled maintenance scripts that legitimately run as a service account
  - Installers and DBA tooling that shell out under a service context
references:
  - https://attack.mitre.org/techniques/T1059/003/
  - https://attack.mitre.org/techniques/T1078/003/
audit_policy:
  gpo_path: >
    Computer Configuration > Windows Settings > Security Settings > Advanced
    Audit Policy Configuration > Detailed Tracking > Audit Process Creation
  command: auditpol /set /subcategory:"Process Creation" /success:enable
  notes: >
    CommandLine is NOT populated in 4688 by default - without the separate
    "Include command line in process creation events" policy this rule can
    still fire but the investigation has nothing to work with. Enable both, or
    prefer Sysmon Event ID 1, which carries the command line natively.
