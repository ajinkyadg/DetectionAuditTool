id: WIN-1002
title: RDP Brute Force Attempt
description: >
  Detects a burst of failed logons (EventID 4625) with LogonType 10 (RemoteInteractive)
  against a single account from a single source IP - classic RDP password spraying,
  usually against internet-facing jump boxes or RDP gateways.
level: high
mitre_attack:
  - T1110.001
  - T1021.001
logsource:
  product: windows
  service: security
event_ids:
  - "4625"
detection_type: threshold
selection:
  EventID: 4625
  LogonType: 10
groupby: IpAddress
timeframe_minutes: 5
threshold: 8
condition: gte
required_fields:
  - TargetUserName
  - IpAddress
  - LogonType
  - WorkstationName
false_positives:
  - Legitimate users behind a corporate VPN/NAT hitting the same jump box
references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://attack.mitre.org/techniques/T1021/001/
audit_policy:
  gpo_path: >
    Computer Configuration > Windows Settings > Security Settings > Advanced
    Audit Policy Configuration > Logon/Logoff > Audit Logon (Success and Failure)
  command: auditpol /set /subcategory:"Logon" /success:enable /failure:enable
  notes: >
    Same subcategory as WIN-1001. Confirm the RDP host's Windows Firewall /
    NLA settings aren't swallowing pre-auth attempts, and that the log source
    is actually the RDP target host, not just a jump-box's own login.
